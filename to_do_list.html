<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC AI Labs - Todo List</title>

     <link rel="stylesheet" href="style.css"> 
</head>

<body style="background-color: #010101;color: white;">

    <div class="container">

        <!-- Logo -->
        <div class="logo">
            <img src="./images/kc-logo.png" alt="KC AI Labs" style="height: 200px; background-color: black;">
        </div>

        <h1 style="text-align: center; color: rgb(255, 217, 0);">KC AI Labs To-Do Manager</h1>

        <!-- Add Task Form -->
        <form id="taskForm">
            <div style="display: flex; margin: 6px; background-color: rgb(0, 123, 255); border: 2px; border-radius: 1%;">
            <label for="task" style="font-size: 2rem;">Enter Task :&nbsp;</label>
            <input
                type="text"
                id="task"
                placeholder="Enter a new task..."
                autocomplete="off"
                required 
                
                style="border-color: #0898f9;height: 3.3rem; ;width: 80%;height: 3rem; border: 5px; color: #2962ff;font-weight: bold;font-size: larger;"
            >
            </div>
            <button type="submit" class="add-btn">
                ➕ Add Task
            </button>

        </form>
        
        <!-- Tabs -->
        <div class="tabs" id="tabs">

            <button
                type="button"
                class="tab-btn active"
                id="pendingTab">
                📋 Pending Tasks
            </button>

            <button
                type="button"
                class="tab-btn"
                id="completedTab">
                ✅ Completed Tasks
            </button>

        </div>

        <!-- Pending Tasks -->

        <section id="pendingSection" class="task-area">

            <ol id="allTask" class="task-list">

                <!-- Example Task -->

                <!--
                <li>

                    <div class="task-title">
                        Complete AI Project
                    </div>

                    <div class="task-time">
                        16 June 2026 | 09:45 PM
                    </div>

                    <div class="task-actions">

                        <button class="done-btn" >
                            ✓ Done
                        </button>

                        <button class="edit-btn" >
                            ✏ Edit
                        </button>

                        <button class="remove-btn" >
                            🗑 Remove
                        </button>

                    </div>

                </li>
                
            -->
            </ol>

        </section>

        <!-- Completed Tasks -->

        <section
            id="completedSection"
            class="task-area"
            style="display:none;"
        >

            <ol id="completedTasks" class="task-list">

                <!-- Example Completed Task -->

                <!--
                <li class="completed-task">

                    <div class="task-title">
                        Learn JavaScript DOM
                    </div>

                    <div class="task-time">
                        Completed on:
                        16 June 2026 | 10:20 PM
                    </div>

                    <div class="task-actions">

                        <button class="remove-btn">
                            🗑 Remove
                        </button>

                    </div>

                </li>
                
            -->
            </ol>

        </section>

    </div>
  <script src="script.js"></script>
</body>
</html>
