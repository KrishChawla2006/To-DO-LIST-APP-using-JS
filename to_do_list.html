<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KC AI Labs - Todo List</title>

     <link rel="stylesheet" href="style.css"> 
</head>

<body style="background-color: #010101;color: white;">

    <div class="container">

        <!-- Logo -->
        <div class="logo">
            <img src="./images/kc-logo.png" alt="KC AI Labs" style="height: 200px; background-color: black;">
        </div>

        <h1 style="text-align: center; color: rgb(255, 217, 0);">KC AI Labs To-Do Manager</h1>

        <!-- Add Task Form -->
        <form id="taskForm">
            <div style="display: flex; margin: 6px; background-color: rgb(0, 123, 255); border: 2px; border-radius: 1%;">
            <label for="task" style="font-size: 2rem;">Enter Task :&nbsp;</label>
            <input
                type="text"
                id="task"
                placeholder="Enter a new task..."
                autocomplete="off"
                required 
                
                style="border-color: #0898f9;height: 3.3rem; ;width: 80%;height: 3rem; border: 5px; color: #2962ff;font-weight: bold;font-size: larger;"
            >
            </div>
            <button type="submit" class="add-btn">
                ➕ Add Task
            </button>

        </form>
        
        <!-- Tabs -->
        <div class="tabs" id="tabs">

            <button
                type="button"
                class="tab-btn active"
                id="pendingTab">
                📋 Pending Tasks
            </button>

            <button
                type="button"
                class="tab-btn"
                id="completedTab">
                ✅ Completed Tasks
            </button>

        </div>

        <!-- Pending Tasks -->

        <section id="pendingSection" class="task-area">

            <ol id="allTask" class="task-list">

                <!-- Example Task -->

                <!--
                <li>

                    <div class="task-title">
                        Complete AI Project
                    </div>

                    <div class="task-time">
                        16 June 2026 | 09:45 PM
                    </div>

                    <div class="task-actions">

                        <button class="done-btn" >
                            ✓ Done
                        </button>

                        <button class="edit-btn" >
                            ✏ Edit
                        </button>

                        <button class="remove-btn" >
                            🗑 Remove
                        </button>

                    </div>

                </li>
                
            -->
            </ol>

        </section>

        <!-- Completed Tasks -->

        <section
            id="completedSection"
            class="task-area"
            style="display:none;"
        >

            <ol id="completedTasks" class="task-list">

                <!-- Example Completed Task -->

                <!--
                <li class="completed-task">

                    <div class="task-title">
                        Learn JavaScript DOM
                    </div>

                    <div class="task-time">
                        Completed on:
                        16 June 2026 | 10:20 PM
                    </div>

                    <div class="task-actions">

                        <button class="remove-btn">
                            🗑 Remove
                        </button>

                    </div>

                </li>
                
            -->
            </ol>

        </section>

    </div>
    <script>

        // Button switch
        const ptab=document.getElementById("pendingTab");
        const ctab=document.getElementById("completedTab");
        const psec=document.getElementById("pendingSection")
        const csec=document.getElementById("completedSection")

        ptab.addEventListener('click',()=>{
            const ele=document.querySelector(".active");
                if(ele!=ptab){
                ele.classList.remove("active");
                ptab.className+=" active";
                const sec=document.getElementById(`${ele.id.substring(0,ele.id.length-3)}Section`);
                sec.style.display="none";
                psec.style.display="block";
                }
        })

        ctab.addEventListener('click',()=>{
            const ele=document.querySelector(".active");
            if(ele!=ctab){
            ele.classList.remove("active");
            ctab.className+=" active";
            const sec=document.getElementById(`${ele.id.substring(0,ele.id.length-3)}Section`);
            sec.style.display="none";
            csec.style.display="block";
        }
            
        })


        const form =document.getElementById("taskForm");
        const ptask=document.getElementById("allTask");//ol
        const ctask=document.getElementById("completedTasks");//ol


        form.addEventListener('submit',(e)=>{
            e.preventDefault();
            let now=new Date();
            const newele=document.createElement("li");
            newele.innerHTML=`
                    <div class="task-title">
                        ${document.getElementById("task").value}
                    </div>

                    <div class="task-time">
                        ${now.toLocaleDateString()} | ${now.toLocaleTimeString()}
                    </div>

                    <div class="task-actions">

                        <button class="done-btn">
                            ✓ Done
                        </button>

                       

                        <button class="remove-btn">
                            🗑 Remove
                        </button>

                    </div>
            `
            const title=newele.querySelector(".task-title");
            const taskTime=newele.querySelector(".task-time");

            const actions=newele.querySelector(".task-actions");
            const edit=document.createElement("button");

            edit.classList.add("edit-btn");
            edit.textContent="✏ Edit";
            edit.addEventListener('click',()=>{
                // one method using promt
                // let newtext=prompt("Enter new Title of taks:",title.textContent.trim())
                // if(newtext!=null){
                //     title.textContent=newtext;
                // }

                // next method using input box
                const input = document.createElement("input");
                input.type = "text";
                input.value = title.textContent.trim();
                input.style.color="blue";
                input.style.fontSize="21px";
                title.replaceWith(input);

                input.focus();

                input.addEventListener("blur", () => {
                    if(input.value!="")title.textContent = input.value;
                    input.replaceWith(title);
                });

                // input.addEventListener("keyup", (e) => {
                //     if(e.key==="Enter"){
                //     if(input.value!="")title.textContent = input.value;
                //     input.replaceWith(title);}
                // });

                // input.addEventListener("keydown", (e) => {
                //     if(e.key==="Enter"){
                //     if(input.value!="")title.textContent = input.value;
                //     input.replaceWith(title);}
                // });

            })
            actions.append(edit);
            ptask.append(newele);


            const done=newele.querySelector(".done-btn");
            done.addEventListener('click',()=>{
                if(done.textContent.trim()=="✓ Done"){
                ptask.removeChild(newele);
                ctask.append(newele);
                done.style.backgroundColor="orange";
                done.textContent="❌ Not Done";
                actions.removeChild(edit);
                let t=new Date();
                taskTime.textContent=`Completed At : ${t.toLocaleDateString()} | ${t.toLocaleTimeString()}`
            }
            else{
                ctask.removeChild(newele);
                done.style.backgroundColor="#00c853";
                done.textContent="✓ Done";
                
                ptask.append(newele);
                actions.append(edit);
                let t=new Date();
                taskTime.textContent=`Arrived At: ${t.toLocaleDateString()} | ${t.toLocaleTimeString()}`
                }

            });

            const rem=newele.querySelector(".remove-btn");
            rem.addEventListener('click',(e)=>{
                let result=confirm(`Are you sure to delete this taks:${newele.querySelector(".task-title").textContent}`);
                if(result)newele.remove();
            })



        })
        
        


    </script>
</body>
</html>
